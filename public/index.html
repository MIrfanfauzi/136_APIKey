<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API Key Generator</title>
  <style>
    :root{
      --bg1: #0f172a;
      --bg2: #0b1020;
      --card: rgba(255,255,255,0.06);
      --accent1: #7c3aed;
      --accent2: #06b6d4;
      --glass: rgba(255,255,255,0.04);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    body{
      background: linear-gradient(135deg, rgba(13,42,148,1) 0%, rgba(6,34,78,1) 45%, rgba(3,12,30,1) 100%);
      display:flex;align-items:center;justify-content:center;padding:40px;
      color:#e6eef8;
    }
    .card{
      width:100%;max-width:760px;padding:36px;border-radius:18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      box-shadow: 0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .header{
      display:flex;align-items:center;gap:14px;margin-bottom:18px;
    }
    .logo{
      width:56px;height:56px;border-radius:12px;
      background:linear-gradient(135deg,var(--accent1),var(--accent2));
      display:flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:18px;box-shadow:0 6px 18px rgba(92,33,186,0.24);
    }
    h1{font-size:20px;margin:0}
    p.lead{margin:4px 0 0 0;color:rgba(230,238,248,0.8);font-size:13px}

    .controls{display:flex;gap:12px;align-items:center;margin-top:20px}
    .btn{
      appearance:none;border:0;padding:12px 18px;border-radius:12px;font-weight:600;cursor:pointer;
      background:linear-gradient(90deg,var(--accent1),var(--accent2));color:white;box-shadow:0 8px 22px rgba(7,13,36,0.6);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:0.6;cursor:not-allowed}

    textarea{
      width:100%;min-height:96px;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
      color:#dcecff;font-size:14px;resize:vertical;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,0.02);
    }
    .meta{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;color:rgba(230,238,248,0.6);font-size:13px}

    .status{margin-top:12px;padding:10px;border-radius:8px;font-size:13px;display:none}
    .status.success{background:rgba(34,197,94,0.1);color:#86efac;border:1px solid rgba(34,197,94,0.2);display:block}
    .status.error{background:rgba(239,68,68,0.1);color:#fca5a5;border:1px solid rgba(239,68,68,0.2);display:block}

    /* subtle animated gradient border */
    .card:before{
      content:"";position:absolute;inset:0;border-radius:22px;padding:1px;pointer-events:none;
      background:linear-gradient(90deg,var(--accent1),#2dd4bf, #60a5fa, var(--accent1));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); 
      -webkit-mask-composite: xor; mask-composite: exclude;opacity:.12;filter:blur(12px);
    }

    @media (max-width:520px){.card{padding:20px}.header{gap:10px}.logo{width:48px;height:48px}}
  </style>
</head>
<body>
  <main class="card" style="position:relative;">
    <div class="header">
      <div class="logo">API</div>
      <div>
        <h1>API Key Generator</h1>
        <p class="lead">Tekan tombol untuk membuat API key baru. Key akan muncul di area teks — salin saat diperlukan.</p>
      </div>
    </div>

    <textarea id="output" readonly placeholder="API key akan muncul di sini setelah tombol ditekan"></textarea>

    <div class="controls">
      <button id="genBtn" class="btn">Buat API Key</button>
      <div id="loading" style="color:rgba(230,238,248,0.7);font-size:13px;display:none;">
        <strong>Loading...</strong>
      </div>
    </div>

    <div id="status" class="status"></div>

    <div class="meta">
      <div>Keamanan: <em>random & secure</em></div>
      <div id="hint">Klik tombol lalu tekan <strong>Ctrl+C</strong> untuk menyalin.</div>
    </div>
  </main>

  <script>
    const btn = document.getElementById('genBtn');
    const out = document.getElementById('output');
    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading');

    btn.addEventListener('click', async () => {
      try {
        btn.disabled = true;
        loadingEl.style.display = 'block';
        statusEl.className = 'status';
        statusEl.textContent = '';

        // Kirim request ke endpoint /create
        const response = await fetch('/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        });

        const data = await response.json();

        if (data.success) {
          out.value = data.apiKey;
          out.focus();
          out.select();

          // Salin otomatis
          navigator.clipboard?.writeText(data.apiKey).catch(() => {});

          statusEl.className = 'status success';
          statusEl.textContent = `✓ ${data.message} - Dibuat: ${new Date(data.createdAt).toLocaleString('id-ID')}`;

          // Umpan balik pada tombol
          const prev = btn.textContent;
          btn.textContent = 'Berhasil! ✓';
          setTimeout(() => btn.textContent = prev, 1800);
        } else {
          statusEl.className = 'status error';
          statusEl.textContent = `✗ ${data.message}`;
        }
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = `✗ Error: ${error.message}`;
      } finally {
        btn.disabled = false;
        loadingEl.style.display = 'none';
      }
    });
  </script>
</body>
</html>
